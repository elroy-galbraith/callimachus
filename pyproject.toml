[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callimachus"
version = "0.1.0"
description = "Configurable PDF → typed-entities → graph → query platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elroy Galbraith" }]

# Engine-only dependencies. Enough to load packs, run extraction (with text
# input or pdfplumber), build Turtle, run SPARQL, and call any LLM provider
# LiteLLM supports (Anthropic, OpenAI, Gemini, Mistral, Bedrock, …).
#
# litellm is pinned to an exact version because of the March 2026 PyPI
# supply-chain attack (versions 1.82.7 and 1.82.8 shipped malicious code).
# Bump deliberately after reviewing the release notes — never use a range.
dependencies = [
  "litellm==1.83.10",
  "PyYAML>=6.0",
  "pyoxigraph>=0.5.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0",
  "pdfplumber>=0.10.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
# Curator: watchdog inbox loop + git-based approval backend.
curator = [
  "watchdog>=4.0.0",
  "gitpython>=3.1.40",
]
# Layout-aware PDF text extraction (heavy; pulls PyTorch).
docling = ["docling>=2.0.0"]
# FastAPI HTTP layer (callimachus.api.*). Consumed by the React frontend.
api = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",  # required by fastapi.testclient
]
# Legacy Streamlit UI — superseded by the React frontend (callimachus.api +
# frontend/). Kept runnable at ``legacy-streamlit/callimachus_ui/`` for reference.
legacy = ["streamlit>=1.30.0"]
# Convenience: everything.
all = [
  "callimachus[curator]",
  "callimachus[docling]",
  "callimachus[api]",
  "callimachus[legacy]",
]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
callimachus-extract  = "scripts.extractor:main"
callimachus-curate   = "scripts.curator:main"
callimachus-ttl      = "scripts.to_turtle:main"
callimachus-load     = "scripts.load_to_oxigraph:main"
callimachus-ask      = "scripts.ask:main"
callimachus-highlight = "scripts.highlight:main"

[tool.setuptools.packages.find]
include = ["callimachus*"]

[tool.setuptools.package-data]
"callimachus.pack.builtin" = ["*/pack.yaml", "*/schema.ttl", "*/sparql/*.rq", "*/hooks.py"]
